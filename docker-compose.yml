# ============================================================
# OpenClaw Docker Compose 配置
# 
# 使用方法:
#   1. 生成并导出 OPENCLAW_GATEWAY_TOKEN
#   2. 运行: docker compose up -d
#   3. 查看日志: docker compose logs -f
# ============================================================

services:
  openclaw:
    build:
      context: .
      args:
        OPENCLAW_VERSION: ${OPENCLAW_VERSION:-2026.9.2}
        NODE_VERSION: ${NODE_VERSION:-22-bookworm-slim}
    image: openclaw:${OPENCLAW_VERSION:-2026.9.2}
    container_name: openclaw
    restart: unless-stopped
    
    # Gateway 必须启用认证；密钥通过 .env 或 shell 环境注入
    environment:
      TZ: Asia/Shanghai
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?set OPENCLAW_GATEWAY_TOKEN}
    
    # 端口映射
    ports:
      - "127.0.0.1:18789:18789"
    
    # 卷挂载
    volumes:
      # 配置和数据持久化
      - ~/.openclaw:/home/node/.openclaw
      # 可选：挂载自定义技能目录
      # - ./custom-skills:/home/node/.openclaw/skills
    
    # 健康检查
    healthcheck:
      test: ["CMD", "openclaw", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # 网络配置
    networks:
      - openclaw-network

  # 可选：Ollama 本地模型服务
  # 取消注释以启用本地 AI 模型
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   restart: unless-stopped
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama-data:/root/.ollama
  #   networks:
  #     - openclaw-network
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]

networks:
  openclaw-network:
    driver: bridge

